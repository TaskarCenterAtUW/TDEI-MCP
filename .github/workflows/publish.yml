name: publish

# Publishes the setup CLI to npm so installers can use the standard
#   npx -y tdei-mcp@<version> setup --env ...
# instead of a git spec: no git, no build on the client, no `prepare` packing
# (which npm 10 breaks on for full-SHA git installs), and a signed provenance
# attestation tying the tarball to this commit.
#
# Nothing is published on merges: only a release tag or a manual dispatch.
# Authentication is npm trusted publishing (GitHub OIDC), so there is no
# long-lived NPM_TOKEN secret. One-time setup on npmjs.com:
#   package tdei-mcp -> Settings -> Trusted publisher -> GitHub Actions
#   repository TaskarCenterAtUW/TDEI-MCP, workflow publish.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:installers
      - run: pnpm test:coverage
      - name: Require the tag to match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            echo "Bump package.json, commit, then tag v$version." >&2
            exit 1
          fi
      - name: Refuse to overwrite an already published version
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "tdei-mcp@$version" version >/dev/null 2>&1; then
            echo "tdei-mcp@$version is already published; bump package.json first." >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
