name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - run: pnpm test:coverage
      - run: pnpm test:mutation
