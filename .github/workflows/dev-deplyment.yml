name: Deploy dev

on:
  pull_request:
    branches: [dev]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tdei-mcp-dev
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy runs on merge, and CI runs on the PR — nothing else gates dev
      # (branch is unprotected), so refuse to ship a tree whose ci checks did
      # not pass. Filter by workflow name: this workflow's own check-runs are
      # attached to the same PR head SHA and would otherwise deadlock the gate.
      - name: Require the merged PR's ci checks to have passed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select((.workflowName // "") == "ci")] |
                  if length == 0 then "none"
                  elif all(.[]; .conclusion == "SUCCESS") then "ok"
                  else ([.[] | "\(.name)=\(.conclusion // .status)"] | join(", "))
                  end')"
          case "$result" in
            ok)
              echo "ci passed for PR #$PR_NUMBER — deploying."
              ;;
            none)
              echo "::error::No ci check-runs found for PR #$PR_NUMBER (skipped run?). Re-run ci, or dispatch this workflow manually to deploy."
              exit 1
              ;;
            *)
              echo "::error::ci did not pass for PR #$PR_NUMBER: $result"
              exit 1
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_DOMAIN }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:dev-latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=0.1.${{ github.run_number }}

  deploy:
    needs: build
    environment:
      name: Development
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

      - name: Store the sign-in secret on the Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          TDEI_OAUTH_SECRET: ${{ secrets.TDEI_OAUTH_SECRET }}
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          if [[ "${#TDEI_OAUTH_SECRET}" -lt 32 ]]; then
            {
              echo "The TDEI_OAUTH_SECRET GitHub secret is missing or shorter than 32 characters."
              echo "Create it in this environment without printing it:"
              echo "  openssl rand -hex 32 | gh secret set TDEI_OAUTH_SECRET --env Development"
            } >&2
            exit 1
          fi
          # Stored as a Container App secret and referenced by the env var below,
          # so it is never baked into the image or shown in the app's settings.
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "tdei-oauth-secret=${TDEI_OAUTH_SECRET}" \
            --only-show-errors \
            --output none

      - name: Deploy to Dev Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          REGISTRY_DOMAIN: ${{ secrets.REGISTRY_DOMAIN }}
          REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          : "${REGISTRY_DOMAIN:?REGISTRY_DOMAIN secret is not configured}"
          : "${REGISTRY_REPO:?REGISTRY_REPO secret is not configured}"
          IMAGE="${REGISTRY_DOMAIN}/${REGISTRY_REPO}:${GITHUB_SHA}"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars "TDEI_OAUTH_SECRET=secretref:tdei-oauth-secret" \
            --only-show-errors \
            --output none

          deployed_image="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"

          if [[ "$deployed_image" != "$IMAGE" ]]; then
            echo "Azure Container App image does not match the image built by this run" >&2
            exit 1
          fi

      - name: Wait for deployed build to answer requests
        env:
          MCP_BASE_URL: ${{ secrets.MCP_BASE_URL }}
        run: |
          if [[ -z "${MCP_BASE_URL:-}" ]]; then
            echo "MCP_BASE_URL secret is not configured — skipping post-deploy verification." >&2
            exit 0
          fi
          for attempt in $(seq 1 30); do
            served_sha="$(curl -fsS "$MCP_BASE_URL/tdei-core-dev/health" | jq -r .build.sha)" || true
            if [[ "$served_sha" == "$GITHUB_SHA" ]]; then
              echo "Deployed build $served_sha is serving traffic."
              exit 0
            fi
            echo "Attempt $attempt: serving sha '${served_sha:-unreachable}', waiting for $GITHUB_SHA..."
            sleep 20
          done
          echo "Timed out waiting for build $GITHUB_SHA to serve traffic" >&2
          exit 1
