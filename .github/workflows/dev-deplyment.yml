name: Deploy dev

on:
  pull_request:
    branches: [dev]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tdei-mcp-dev
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    environment: Development
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      # Deploy runs on merge, and CI runs on the PR — nothing else gates dev
      # (branch is unprotected), so refuse to ship a tree whose ci checks did
      # not pass. Filter by workflow name: this workflow's own check-runs are
      # attached to the same PR head SHA and would otherwise deadlock the gate.
      - name: Require the merged PR's ci checks to have passed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select((.workflowName // "") == "ci")] |
                  if length == 0 then "none"
                  elif all(.[]; .conclusion == "SUCCESS") then "ok"
                  else ([.[] | "\(.name)=\(.conclusion // .status)"] | join(", "))
                  end')"
          case "$result" in
            ok)
              echo "ci passed for PR #$PR_NUMBER — deploying."
              ;;
            none)
              echo "::error::No ci check-runs found for PR #$PR_NUMBER (skipped run?). Re-run ci, or dispatch this workflow manually to deploy."
              exit 1
              ;;
            *)
              echo "::error::ci did not pass for PR #$PR_NUMBER: $result"
              exit 1
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_DOMAIN }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # vars.TDEI_NPX_PACKAGE stays empty until the CLI is published on npm.
      # Set that repository variable to tdei-mcp@<version> to switch every
      # install page/message from the git fallback to the npm spec.
      - id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The run-numbered tag is immutable: rebuilding the same commit
          # produces a new BUILD_VERSION, so a bare SHA tag would silently
          # point at whichever build ran last. Deploys pin the digest below;
          # dev-latest stays an explicitly floating pointer.
          tags: |
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}-r${{ github.run_number }}
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:dev-latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=0.1.${{ github.run_number }}
            TDEI_NPX_PACKAGE=${{ vars.TDEI_NPX_PACKAGE }}

  deploy:
    needs: build
    environment:
      name: Development
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

      - name: Store the sign-in secret on the Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          TDEI_OAUTH_SECRET: ${{ secrets.TDEI_OAUTH_SECRET }}
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          if [[ "${#TDEI_OAUTH_SECRET}" -lt 32 ]]; then
            {
              echo "The TDEI_OAUTH_SECRET GitHub secret is missing or shorter than 32 characters."
              echo "Create it in this environment without printing it:"
              echo "  openssl rand -hex 32 | gh secret set TDEI_OAUTH_SECRET --env Development"
            } >&2
            exit 1
          fi
          # Stored as a Container App secret and referenced by the env var below,
          # so it is never baked into the image or shown in the app's settings.
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "tdei-oauth-secret=${TDEI_OAUTH_SECRET}" \
            --only-show-errors \
            --output none

      - name: Deploy to Dev Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          REGISTRY_DOMAIN: ${{ secrets.REGISTRY_DOMAIN }}
          REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          # Sizing/scale. Consumption plan only accepts memory = 2 x vCPU
          # (0.25/0.5Gi, 0.5/1Gi, 0.75/1.5Gi, 1/2Gi ...); 1 vCPU + 0.5Gi is
          # rejected. Override per environment with repository/environment vars.
          APP_CPU: ${{ vars.TDEI_APP_CPU || '0.5' }}
          APP_MEMORY: ${{ vars.TDEI_APP_MEMORY || '1Gi' }}
          # Always on (min 1) so in-process tdei_sso_login sessions survive idle
          # periods; set TDEI_MIN_REPLICAS=0 to scale to zero and save more. Max
          # stays 1: sessions live in-process, so a second replica would split them.
          MIN_REPLICAS: ${{ vars.TDEI_MIN_REPLICAS || '1' }}
          MAX_REPLICAS: '1'
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          : "${REGISTRY_DOMAIN:?REGISTRY_DOMAIN secret is not configured}"
          : "${REGISTRY_REPO:?REGISTRY_REPO secret is not configured}"
          : "${IMAGE_DIGEST:?Build did not expose an image digest}"
          # Pin the exact digest this run built. A tag (even a SHA tag) can be
          # overwritten by a later rebuild of the same commit, so deploying by
          # tag can silently run a different image than the one just verified.
          IMAGE="${REGISTRY_DOMAIN}/${REGISTRY_REPO}@${IMAGE_DIGEST}"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars "TDEI_OAUTH_SECRET=secretref:tdei-oauth-secret" \
            --cpu "$APP_CPU" \
            --memory "$APP_MEMORY" \
            --min-replicas "$MIN_REPLICAS" \
            --max-replicas "$MAX_REPLICAS" \
            --scale-rule-name http-wake \
            --scale-rule-type http \
            --scale-rule-http-concurrency 50 \
            --only-show-errors \
            --output none

          deployed_image="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"

          if [[ "$deployed_image" != "$IMAGE" ]]; then
            echo "Azure Container App image does not match the image digest built by this run" >&2
            exit 1
          fi

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '{cpu: properties.template.containers[0].resources.cpu, memory: properties.template.containers[0].resources.memory, minReplicas: properties.template.scale.minReplicas, maxReplicas: properties.template.scale.maxReplicas, workloadProfile: properties.workloadProfileName}' \
            --output table

      - name: Wait for deployed build to answer requests
        env:
          MCP_BASE_URL: ${{ secrets.MCP_BASE_URL }}
          # Full build id (version+sha): two builds of the same commit differ
          # in BUILD_VERSION, so a SHA-only check can pass against a stale build.
          EXPECTED_ID: 0.1.${{ github.run_number }}+${{ github.sha }}
        run: |
          if [[ -z "${MCP_BASE_URL:-}" ]]; then
            echo "::error::MCP_BASE_URL secret is not configured — cannot verify the deployed build. Failing closed: set it to the public gateway origin (e.g. https://<app>.azurecontainerapps.io) so deploys verify the served build id."
            exit 1
          fi
          # After a new revision starts (nginx + 6 node children loading their
          # OpenAPI specs) the first probes may fail; 30 x 20s covers it.
          for attempt in $(seq 1 30); do
            served_id="$(curl -fsS "$MCP_BASE_URL/tdei-core-dev/health" | jq -r '"\(.build.version)+\(.build.sha)"')" || true
            if [[ "$served_id" == "$EXPECTED_ID" ]]; then
              echo "Deployed build $served_id is serving traffic."
              exit 0
            fi
            echo "Attempt $attempt: serving build '${served_id:-unreachable}', waiting for $EXPECTED_ID..."
            sleep 20
          done
          echo "Timed out waiting for build $EXPECTED_ID to serve traffic" >&2
          exit 1
