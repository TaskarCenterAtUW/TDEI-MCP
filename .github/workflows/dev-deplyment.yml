name: Deploy dev

on:
  pull_request:
    branches: [dev]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tdei-mcp-dev
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_DOMAIN }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}
            ${{ secrets.REGISTRY_DOMAIN }}/${{ secrets.REGISTRY_REPO }}:dev-latest
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: build
    environment:
      name: Development
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

      - name: Deploy to Dev Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          REGISTRY_DOMAIN: ${{ secrets.REGISTRY_DOMAIN }}
          REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          : "${REGISTRY_DOMAIN:?REGISTRY_DOMAIN secret is not configured}"
          : "${REGISTRY_REPO:?REGISTRY_REPO secret is not configured}"
          IMAGE="${REGISTRY_DOMAIN}/${REGISTRY_REPO}:${GITHUB_SHA}"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --only-show-errors \
            --output none

          deployed_image="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"

          if [[ "$deployed_image" != "$IMAGE" ]]; then
            echo "Azure Container App image does not match the image built by this run" >&2
            exit 1
          fi

      - name: Wait for deployed build to answer requests
        env:
          MCP_BASE_URL: ${{ secrets.MCP_BASE_URL }}
        run: |
          : "${MCP_BASE_URL:?MCP_BASE_URL secret is not configured}"
          for attempt in $(seq 1 30); do
            served_sha="$(curl -fsS "$MCP_BASE_URL/tdei-core-dev/health" | jq -r .build.sha)" || true
            if [[ "$served_sha" == "$GITHUB_SHA" ]]; then
              echo "Deployed build $served_sha is serving traffic."
              exit 0
            fi
            echo "Attempt $attempt: serving sha '${served_sha:-unreachable}', waiting for $GITHUB_SHA..."
            sleep 20
          done
          echo "Timed out waiting for build $GITHUB_SHA to serve traffic" >&2
          exit 1
