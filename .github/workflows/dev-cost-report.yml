name: Dev cost report

# Manual run: approximate cost of the dev Container App (last N days actual,
# next N days forecast, cost by component and log ingestion). Uses the same
# Azure login as the deploy workflow, so it works without a personal Azure
# account. Read-only: it only queries Azure Cost Management and Log Analytics.
#
# The deploy principal needs read access to cost data on GaussianRG (Contributor
# already includes it) and to the Log Analytics workspace.

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: Days of actual cost to report
        default: "15"
      days_ahead:
        description: Days to forecast
        default: "15"
      app_only:
        description: Count only the Container App (skip ACR and Log Analytics)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  report:
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

      - name: Cost report
        env:
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: GaussianRG
          DAYS_BACK: ${{ inputs.days_back }}
          DAYS_AHEAD: ${{ inputs.days_ahead }}
          APP_ONLY: ${{ inputs.app_only }}
        run: |
          : "${CONTAINER_APP_NAME:?CONTAINER_APP_NAME secret is not configured}"
          [[ "$DAYS_BACK" =~ ^[0-9]+$ && "$DAYS_AHEAD" =~ ^[0-9]+$ ]] || {
            echo "days_back and days_ahead must be whole numbers" >&2; exit 1; }
          # Let az install the log-analytics extension without prompting.
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true --only-show-errors
          args=()
          [[ "$APP_ONLY" == "true" ]] && args+=(--app-only)
          bash scripts/azure-cost-report.sh "${args[@]}" 2>&1 | tee report.txt
          {
            echo '## Dev Container App cost report'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
