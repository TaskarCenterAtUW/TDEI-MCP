# Example output of: npm run gateway:generate (uses --upstream-host multi)
# Real file (nginx/nginx.conf) is generated from your local mcps.json and gitignored.
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # tdei-core -> https://api-dev.tdei.us
    location = /tdei-core/mcp {
        set $tdei_upstream_tdei_core multi:3000;
        proxy_pass http://$tdei_upstream_tdei_core;
    }
    location = /tdei-core/health {
        set $tdei_upstream_tdei_core multi:3000;
        proxy_pass http://$tdei_upstream_tdei_core/health;
    }

    # tdei-workspace -> https://api-stage.tdei.us
    location = /tdei-workspace/mcp {
        set $tdei_upstream_tdei_workspace multi:3001;
        proxy_pass http://$tdei_upstream_tdei_workspace;
    }
    location = /tdei-workspace/health {
        set $tdei_upstream_tdei_workspace multi:3001;
        proxy_pass http://$tdei_upstream_tdei_workspace/health;
    }

    location = / {
        default_type text/html;
        return 200 '<!doctype html><title>TDEI MCP gateway</title><h1>TDEI MCP gateway</h1><p>POST MCP JSON-RPC to &lt;gateway&gt;/tdei-core/mcp etc.</p>';
    }
}
